<!DOCTYPE html>
<html lang="vi" class="gate-locked">
<head>
<meta charset="utf-8">
<style>html.gate-locked body{visibility:hidden!important}</style>
<script src="../../../common/gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minh họa | Linh tinh</title>
<link rel="icon" type="image/svg+xml" href="https://nnmy.github.io/lib/logo-my.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lt.css">
<!--
  =====================================================================
  CHẠY MINH HỌA ĐỘC LẬP  (linh-tinh/lib/demos/run.html)
  - run.html                 : danh sách mọi minh họa
  - run.html?demo=attn-2d    : chạy một minh họa (id = tên file .js trong thư mục này)
  Thêm minh họa mới: tạo lib/demos/<id>.js (gọi LT.demo) và thêm một dòng vào DEMOS.
  MINH HỌA DÙNG DỊCH VỤ BÊN NGOÀI (⚠): khai báo def.external = { name, check } và thêm trường external vào DEMOS.
  Hiện nhóm Linh tinh KHÔNG có minh họa nào dùng dịch vụ bên ngoài.
  =====================================================================
-->
<style>
  body { padding: 28px 0 60px; }
  .runhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; margin-bottom: 18px; }
  .runhead h1 { font-size: clamp(34px, 4.6vw, 52px); }
  .runhead a { font-weight: 600; }
  .list h2 { font-size: 30px; margin: 30px 0 10px; }
  .list ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .list a { display: block; padding: 10px 14px; background: #fff; border: 2px solid var(--ink); color: var(--ink); text-decoration: none; font-weight: 600; }
  .list a:hover { box-shadow: 4px 4px 0 var(--sky); }
  .list small { display: block; color: var(--muted); font-weight: 400; }
</style>
</head>
<body data-no-toc>
<noscript><p style="visibility:visible;margin:40px auto;max-width:520px;padding:0 20px;font:16px system-ui,sans-serif">Trang cần bật JavaScript để xem.</p></noscript>
<main class="wrap" id="app"></main>
<script src="../lt.js"></script>
<script>
const DEMOS = [
  { id: 'screen', domId: 'demoScreen', title: 'Màn hình, mắt và giấc ngủ', page: 'man-hinh.html', pageTitle: 'Màn hình và đôi mắt' },
  { id: 'aging', domId: 'demoAging', title: 'Cơ thể qua từng độ tuổi', page: 'lao-hoa.html', pageTitle: 'Cơ thể khi về già' },
  // DEMOS-LIST (thêm dòng mới ở đây)
];
const app = document.getElementById('app');
const id = new URLSearchParams(location.search).get('demo');
const d = DEMOS.find(x => x.id === id);
if (d) {
  document.title = d.title + ' | Linh tinh';
  app.innerHTML = `<div class="runhead"><h1>${d.title}</h1><span><a href="run.html">Tất cả minh họa</a>  |  <a href="../../${d.page}#${d.domId}">Xem trong trang "${d.pageTitle}"</a></span></div>
    <div class="demo" id="${d.domId}" data-demo="${d.id}"><div class="demo-loading">Đang tải…</div></div>`;
  LT.mountDemo(app.querySelector('.demo'), d.id);
} else {
  const groups = {};
  DEMOS.forEach(x => (groups[x.pageTitle] = groups[x.pageTitle] || []).push(x));
  app.innerHTML = `<div class="runhead"><h1>Minh họa Linh tinh</h1><a href="../../index.html">Trang chủ Linh tinh</a></div>
    <p class="note-s">Mỗi minh họa có thể chạy riêng ở đây, hoặc nhúng vào trang bằng một thẻ &lt;div data-demo&gt; và lib/lt.js.</p>
    <p class="note-s">${LT.EXT_ICON} Minh họa có dấu cảnh báo gọi dịch vụ bên ngoài (${DEMOS.filter(x => x.external).map(x => x.id).join(', ')}). Nếu dịch vụ ngừng hoạt động, minh họa tự ẩn và hiện thông báo; các minh họa khác chạy hoàn toàn trên trình duyệt.</p>
    <div class="list">${Object.entries(groups).map(([g, xs]) => `<h2>${g}</h2><ul>${xs.map(x => `<li><a href="run.html?demo=${x.id}">${x.title}<small>${x.id}.js${x.external ? ' · ' + LT.EXT_ICON + ' dịch vụ ngoài: ' + x.external : ''}</small></a></li>`).join('')}</ul>`).join('')}</div>`;
}
</script>
</body>
</html>
